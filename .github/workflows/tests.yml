name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Static Analysis & Formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, soap, gd, exif, iconv
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer analyse

      # Dry run: any change Rector would make fails the build. rector.php
      # records which rules are skipped and why.
      - name: Run Rector
        run: composer rector

      - name: Check code style
        run: vendor/bin/pint --test

      # laravel/framework "replace"s every illuminate/* package, so the
      # components composer.json requires are never physically installed and
      # their symbols cannot be resolved. composer-require-checker.json
      # whitelists exactly what the tool structurally cannot see, enumerated
      # rather than wildcarded: adding a new Illuminate class means editing that
      # file, which is when someone should notice the framework coupling grew.
      - name: Check for undeclared dependencies
        run: |
          composer global require --no-interaction maglnet/composer-require-checker
          "$(composer global config home)/vendor/bin/composer-require-checker" check             --config-file=composer-require-checker.json composer.json

      # The provider list and capability matrix are generated from src/Drivers.
      # This fails the build if a driver was added or its capabilities changed
      # without regenerating, which is what stopped the docs drifting from
      # "8 providers" to nine to ten by hand.
      - name: Check generated documentation is current
        run: vendor/bin/testbench payzephyr:docs --check

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [12.*]
        include:
          - laravel: 12.*
            testbench: 10.*
            pest: ^3.0
            pest-plugin: ^3.0

          # Laravel 13 requires PHP 8.3+, but its test tooling (Pest 5 /
          # PHPUnit 13) requires PHP 8.4+ specifically - so this is a
          # standalone combination rather than a cross-product entry against
          # the php/laravel arrays above (which would also generate invalid
          # php-8.2+laravel-13 and php-8.3+laravel-13 pairs).
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            pest: ^5.0
            pest-plugin: ^5.0

          - php: 8.5
            laravel: 13.*
            testbench: 11.*
            pest: ^5.0
            pest-plugin: ^5.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, soap, gd, exif, iconv
          coverage: none  # Disable Xdebug for regular tests (faster)

      - name: Cache Composer
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-${{ matrix.php }}-

      - name: Configure dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require --dev "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          mkdir -p .phpunit.cache
          mkdir -p build/coverage
          mkdir -p build/logs

      # Parallel on purpose: a test that writes to shared state - the
      # Testbench skeleton, a fixed temp path - fails here instead of flaking
      # later. The coverage job below stays serial.
      - name: Execute tests
        run: vendor/bin/pest --parallel

  # The suite once more on each server database. SQLite differs from both
  # exactly where this package leans on the database: row locks
  # (lockForUpdate), unique-violation detection, decimal sums and datetime
  # precision. tests/TestCase.php reads DB_CONNECTION. Serial, because every
  # process would share the one database.
  databases:
    runs-on: ubuntu-latest
    name: Tests on ${{ matrix.database }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
            username: root
            password: ''
          - database: pgsql
            port: 5432
            username: postgres
            password: postgres

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: payzephyr_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payzephyr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, bcmath, intl, soap, gd, exif, iconv
          coverage: none

      - name: Configure dependencies for Laravel 12
        run: |
          composer require "laravel/framework:12.*" --no-interaction --no-update
          composer require --dev "orchestra/testbench:10.*" --no-interaction --no-update
          composer require --dev "pestphp/pest:^3.0" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:^3.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: mkdir -p .phpunit.cache

      - name: Execute tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: payzephyr_test
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}

  # A webhook job serialized onto a Redis queue and run by a worker, and the
  # in-flight claims Cache::add takes, on the store production uses. The
  # tests skip without REDIS_HOST, so the step also checks they ran.
  redis:
    runs-on: ubuntu-latest
    name: Queue and cache on Redis

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, bcmath, intl, soap, gd, exif, iconv
          coverage: none

      - name: Configure dependencies for Laravel 12
        run: |
          composer require "laravel/framework:12.*" --no-interaction --no-update
          composer require --dev "orchestra/testbench:10.*" --no-interaction --no-update
          composer require --dev "pestphp/pest:^3.0" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:^3.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: mkdir -p .phpunit.cache

      - name: Execute Redis tests
        run: |
          vendor/bin/pest tests/Integration/RedisQueueAndCacheTest.php --colors=never | tee redis-tests.log
          grep -q "3 passed" redis-tests.log
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
  # Every mutation of the webhook trust boundary and the drivers must be
  # caught by a test: the code that decides whether a delivery is genuine,
  # fresh and new, and the code that turns a provider's answer into money.
  # See ADR-0003. Pest's own mutation testing, since the suite is Pest.
  mutation:
    runs-on: ubuntu-latest
    name: Mutation Testing

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, soap, gd, exif, iconv
          coverage: pcov

      - name: Configure dependencies for Laravel 12
        run: |
          composer require "laravel/framework:12.*" --no-interaction --no-update
          composer require --dev "orchestra/testbench:10.*" --no-interaction --no-update
          composer require --dev "pestphp/pest:^3.0" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:^3.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: mkdir -p .phpunit.cache

      - name: Run mutation testing
        run: composer mutation

  coverage:
    runs-on: ubuntu-latest
    name: Coverage Report

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, soap, gd, exif, iconv
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: vendor
          key: composer-8.4-12-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-8.4-12-
            composer-8.4-

      - name: Configure dependencies for Laravel 12
        run: |
          composer require "laravel/framework:12.*" --no-interaction --no-update
          composer require --dev "orchestra/testbench:10.*" --no-interaction --no-update
          composer require --dev "pestphp/pest:^3.0" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:^3.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

      - name: Prepare test environment
        run: |
          mkdir -p .phpunit.cache
          mkdir -p build/coverage
          mkdir -p build/logs

      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage --min=100 --coverage-clover=build/logs/clover.xml --coverage-html=build/coverage --coverage-text=build/coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./build/logs/clover.xml
          fail_ci_if_error: false